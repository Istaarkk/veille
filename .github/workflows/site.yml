name: Veille — génération du site

on:
  schedule:
    # Toutes les heures de ~6h à ~23h (heure de Paris). Le fil est rafraîchi à chaque fois ;
    # le brief IA n'est régénéré que s'il a plus de BRIEF_MAX_AGE_HEURES (5 h par défaut).
    - cron: '7 4-21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Récupérer le brief déjà publié
        run: |
          mkdir -p public
          curl -fsSL --max-time 20 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/brief.json" -o public/brief.json || rm -f public/brief.json

      - name: Générer le site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Un lancement manuel force un brief neuf.
        run: python main.py --sortie public ${{ github.event_name == 'workflow_dispatch' && '--forcer-brief' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
